name: Bygg Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installera beroenden
        run: npm ci

      - name: Enhetstester (bäring, avstånd, Maps-länkar, kompass)
        run: npm test

      - name: Synka webbfiler till Android
        run: npx cap sync android

      - name: Bygg debug-APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Vixor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicera som release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Vixor.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Vixor.apk \
            --title "Vixor (senaste bygget)" \
            --notes "Automatiskt bygge av commit ${GITHUB_SHA::7}" \
            --target "${GITHUB_SHA}"
